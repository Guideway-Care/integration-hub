name: CD

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/control-plane

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: api-server
            file: docker/api-server.Dockerfile
          - name: control-plane
            file: docker/control-plane.Dockerfile
          - name: extraction-job
            file: docker/extraction-job.Dockerfile
          - name: incontact-processor
            file: docker/incontact-processor.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push ${{ matrix.target.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.target.file }}
          push: true
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ matrix.target.name }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ matrix.target.name }}:latest

    outputs:
      image_tag: ${{ github.sha }}

  migrate-db:
    name: Migrate Cloud SQL Schema
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ vars.CLOUD_SQL_CONNECTION }}" &
          echo "PROXY_PID=$!" >> $GITHUB_ENV
          # Wait until the proxy is listening
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Proxy ready"; break
            fi
            sleep 1
          done

      - name: Migrate & verify Cloud SQL schema
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          # The prod DATABASE_URL targets the Cloud Run unix socket
          # (?host=/cloudsql/...). For tools running on the GH runner we
          # rebuild the URL pointing at the local proxy on 127.0.0.1:5432.
          # Anchor each capture to a unique delimiter:
          #   USER  = chars between `://` and the first `:`
          #   PW    = chars between that `:` and `@`
          #   DB    = chars between `@/` and `?` (unix-socket form has empty
          #           host, so `@/DBNAME?host=...`). Naive `.*/(...)` would
          #           greedily match into `?host=/cloudsql/...` and grab the
          #           wrong segment.
          DB_USER=$(echo "$PROD_DATABASE_URL" | sed -E 's|^[a-z]+://([^:]+):.*|\1|')
          DB_PW=$(echo "$PROD_DATABASE_URL" | sed -E 's|^[a-z]+://[^:]+:([^@]+)@.*|\1|')
          DB_NAME=$(echo "$PROD_DATABASE_URL" | sed -E 's|^[a-z]+://[^@]+@/?([^/?]+)(\?.*)?$|\1|')
          if [ -z "$DB_USER" ] || [ -z "$DB_PW" ] || [ -z "$DB_NAME" ]; then
            echo "Failed to parse DATABASE_URL (user='$DB_USER' db='$DB_NAME')"
            exit 1
          fi
          echo "Parsed user=$DB_USER db=$DB_NAME (pw redacted)"
          # psql + drizzle both connect via the rebuilt URI. Use the URI form
          # (not PGPASSWORD) so a percent-encoded password decodes identically
          # to how drizzle-kit parses it.
          PSQL_URI="postgresql://${DB_USER}:${DB_PW}@127.0.0.1:5432/${DB_NAME}"

          echo "::group::Guarded idempotent SQL (constraint + scheduled_job_run)"
          # `drizzle-kit push --force` does NOT auto-answer the interactive
          # "add unique constraint -> truncate?" SELECT prompt; on this non-TTY
          # runner it EOF-aborts and applies NOTHING (a silent no-op that still
          # exits 0). We apply the one blocking constraint deterministically
          # here (additive, no truncation, fails loudly on real duplicates) and
          # ensure the append-only scheduled_job_run table exists, so the plain
          # push below has zero data-loss statements to prompt about.
          psql "$PSQL_URI" -v ON_ERROR_STOP=1 <<'SQL'
          -- 1) Refuse to proceed if real duplicates exist (never truncate).
          DO $$
          DECLARE dup_groups integer;
          BEGIN
            SELECT count(*) INTO dup_groups FROM (
              SELECT 1 FROM endpoint_parameter
              GROUP BY endpoint_id, parameter_name HAVING count(*) > 1
            ) d;
            IF dup_groups > 0 THEN
              RAISE EXCEPTION 'endpoint_parameter has % duplicate (endpoint_id, parameter_name) group(s); dedupe before adding uq_endpoint_parameter_name.', dup_groups;
            END IF;
          END $$;
          -- 2) Add the unique constraint if missing (additive, no truncation).
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'uq_endpoint_parameter_name') THEN
              ALTER TABLE endpoint_parameter
                ADD CONSTRAINT uq_endpoint_parameter_name UNIQUE (endpoint_id, parameter_name);
            END IF;
          END $$;
          -- 3) Ensure scheduled_job_run exists; columns/types/indexes match
          --    lib/db/src/schema/scheduled-job-run.ts exactly so push sees no diff.
          CREATE TABLE IF NOT EXISTS scheduled_job_run (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            job_name text NOT NULL,
            run_date text NOT NULL,
            trigger text NOT NULL,
            status text NOT NULL,
            phase text,
            started_at timestamptz,
            completed_at timestamptz,
            duration_ms integer,
            error text,
            detail_json jsonb,
            created_ts timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS idx_scheduled_run_job_created ON scheduled_job_run (job_name, created_ts);
          CREATE INDEX IF NOT EXISTS idx_scheduled_run_job_date ON scheduled_job_run (job_name, run_date);
          SQL
          echo "::endgroup::"

          echo "::group::Prod schema drift report (read-only)"
          # Our only window into prod drift from CI. Review before trusting push.
          psql "$PSQL_URI" -v ON_ERROR_STOP=1 <<'SQL'
          \echo '--- columns (public) ---'
          SELECT table_name, column_name, data_type, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_schema = 'public'
          ORDER BY table_name, ordinal_position;
          \echo '--- constraints (public) ---'
          SELECT conrelid::regclass AS tbl, conname, pg_get_constraintdef(oid) AS def
          FROM pg_constraint
          WHERE connamespace = 'public'::regnamespace
          ORDER BY 1, 2;
          \echo '--- indexes (public) ---'
          SELECT tablename, indexname
          FROM pg_indexes WHERE schemaname = 'public'
          ORDER BY 1, 2;
          SQL
          echo "::endgroup::"

          echo "::group::drizzle-kit push (plain, no --force, stdin closed)"
          # Plain push (NOT --force): additive changes apply non-interactively.
          # Any remaining DATA-LOSS statement makes push prompt and, on this
          # non-TTY runner, EOF-abort WITHOUT applying — caught by the checks
          # below. This turns accidental destructive drift into a red build
          # instead of silent data loss or a silent no-op.
          export DATABASE_URL="$PSQL_URI"
          pnpm --filter @workspace/db run push </dev/null 2>&1 | tee /tmp/push.log
          echo "::endgroup::"

          echo "::group::Verify convergence"
          if grep -qiE "do you want to truncate|you're about to|about to add" /tmp/push.log; then
            echo "ERROR: drizzle-kit push hit an interactive data-loss prompt (unexpected destructive drift). Failing the build; review the drift report above."
            exit 1
          fi
          if ! grep -qi "Changes applied" /tmp/push.log; then
            echo "ERROR: drizzle-kit push did not report 'Changes applied' — possible silent no-op."
            exit 1
          fi
          OK=$(psql "$PSQL_URI" -tAc "SELECT (to_regclass('public.scheduled_job_run') IS NOT NULL) AND EXISTS (SELECT 1 FROM pg_constraint WHERE conname='uq_endpoint_parameter_name')")
          if [ "$OK" != "t" ]; then
            echo "ERROR: post-migration verification failed (scheduled_job_run and/or uq_endpoint_parameter_name missing)."
            exit 1
          fi
          echo "OK: scheduled_job_run present, uq_endpoint_parameter_name present, push converged."
          echo "::endgroup::"

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: |
          if [ -n "${PROXY_PID:-}" ]; then kill "$PROXY_PID" 2>/dev/null || true; fi

  deploy-api-server:
    name: Deploy API Server
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-db]
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: api-server
          image: ${{ env.ARTIFACT_REGISTRY }}/api-server:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --service-account=api-controller-hub-dev@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ vars.CLOUD_SQL_CONNECTION }}
            --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }},NODE_ENV=production,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},API_SERVER_URL=https://api-server-g3tph2rhoa-uc.a.run.app,SCHEDULER_SERVICE_ACCOUNT=api-controller-hub-dev@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --no-cpu-throttling
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --port=8080
            --allow-unauthenticated

  deploy-control-plane:
    name: Deploy Control Plane
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: control-plane
          image: ${{ env.ARTIFACT_REGISTRY }}/control-plane:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --set-env-vars=API_UPSTREAM=https://api-server-g3tph2rhoa-uc.a.run.app
            --min-instances=0
            --max-instances=5
            --memory=256Mi
            --cpu=1
            --port=8080
            --allow-unauthenticated

  deploy-extraction-job:
    name: Deploy Extraction Job
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-db]
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update Cloud Run Job
        run: |
          if gcloud run jobs describe extraction-job --region=${{ env.GCP_REGION }} > /dev/null 2>&1; then
            gcloud run jobs update extraction-job \
              --image=${{ env.ARTIFACT_REGISTRY }}/extraction-job:${{ github.sha }} \
              --region=${{ env.GCP_REGION }} \
              --service-account=api-controller-hub-dev@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
              --set-cloudsql-instances=${{ vars.CLOUD_SQL_CONNECTION }} \
              --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }},NODE_ENV=production,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }} \
              --memory=1Gi \
              --cpu=1 \
              --max-retries=1 \
              --task-timeout=7200s
          else
            gcloud run jobs create extraction-job \
              --image=${{ env.ARTIFACT_REGISTRY }}/extraction-job:${{ github.sha }} \
              --region=${{ env.GCP_REGION }} \
              --service-account=api-controller-hub-dev@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
              --set-cloudsql-instances=${{ vars.CLOUD_SQL_CONNECTION }} \
              --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }},NODE_ENV=production,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }} \
              --memory=1Gi \
              --cpu=1 \
              --max-retries=1 \
              --task-timeout=7200s
          fi

  deploy-incontact-jobs:
    name: Deploy InContact Jobs
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy InContact Processor Job
        run: |
          if gcloud run jobs describe incontact-call-processor --region=${{ env.GCP_REGION }} > /dev/null 2>&1; then
            gcloud run jobs update incontact-call-processor \
              --image=${{ env.ARTIFACT_REGISTRY }}/incontact-processor:${{ github.sha }} \
              --region=${{ env.GCP_REGION }} \
              --set-env-vars=GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }} \
              --memory=512Mi \
              --cpu=1 \
              --max-retries=3 \
              --task-timeout=86400s
          else
            gcloud run jobs create incontact-call-processor \
              --image=${{ env.ARTIFACT_REGISTRY }}/incontact-processor:${{ github.sha }} \
              --region=${{ env.GCP_REGION }} \
              --set-env-vars=GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }} \
              --memory=512Mi \
              --cpu=1 \
              --max-retries=3 \
              --task-timeout=86400s
          fi

      - name: Deploy InContact Loader Job
        run: |
          if gcloud run jobs describe incontact-call-loader --region=${{ env.GCP_REGION }} > /dev/null 2>&1; then
            gcloud run jobs update incontact-call-loader \
              --image=${{ env.ARTIFACT_REGISTRY }}/incontact-processor:${{ github.sha }} \
              --region=${{ env.GCP_REGION }} \
              --set-env-vars=GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }} \
              --command=node,loader.js \
              --memory=512Mi \
              --cpu=1 \
              --max-retries=0 \
              --task-timeout=1800s
          else
            gcloud run jobs create incontact-call-loader \
              --image=${{ env.ARTIFACT_REGISTRY }}/incontact-processor:${{ github.sha }} \
              --region=${{ env.GCP_REGION }} \
              --set-env-vars=GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }} \
              --command=node,loader.js \
              --memory=512Mi \
              --cpu=1 \
              --max-retries=0 \
              --task-timeout=1800s
          fi

  sync-schedules:
    name: Sync Cloud Scheduler
    runs-on: ubuntu-latest
    needs: [deploy-api-server, deploy-extraction-job]
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Sync schedules via API
        run: |
          API_URL="https://api-server-g3tph2rhoa-uc.a.run.app"
          curl -s -f -X POST "$API_URL/api/scheduler/sync" \
            -H "Content-Type: application/json" \
            || echo "Schedule sync skipped (API may not be ready yet)"
