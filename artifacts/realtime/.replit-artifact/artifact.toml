kind = "web"
previewPath = "/realtime/"
title = "NICE Live Monitor"
version = "1.0.0"
id = "artifacts/realtime"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/realtime/" ]
localPort = 18916

[services.development]
run = "pnpm --filter @workspace/realtime run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/realtime", "run", "build" ]
publicDir = "artifacts/realtime/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18916"
BASE_PATH = "/realtime/"
